name: Nightly iOS rehearsal

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: nightly-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/release.yml
  ios:
    uses: ./.github/workflows/ios-ci.yml
